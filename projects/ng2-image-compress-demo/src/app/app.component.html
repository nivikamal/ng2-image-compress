<h2>ng2-image-compress demo</h2>

<button (click)="fileInput.click()">Select images</button>
<input
  #fileInput
  type="file"
  (change)="onFilesSelected($event)"
  multiple
  accept="image/*"
  style="display: none"
/>

<div style="margin-top: 16px">
  <h3>Preview</h3>
  <div *ngFor="let img of images" style="margin-bottom: 16px; border-bottom: 1px solid #eee; padding-bottom: 16px">
    <div style="font-weight: 600; margin-bottom: 8px">{{ img.fileName }}</div>
    <div style="display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap">
      <div style="flex: 1 1 300px; max-width: 600px">
        <div style="margin-bottom: 4px">Original ({{ img.type }})</div>
        <img
          [src]="img.imageDataUrl"
          style="max-width: 100%; height: auto; border: 1px solid #ddd; padding: 4px"
        />
      </div>
      <div style="flex: 1 1 300px; max-width: 600px" *ngIf="img.compressedImage as cimg">
        <div style="margin-bottom: 4px">Compressed ({{ cimg.type }})</div>
        <img
          [src]="cimg.imageDataUrl"
          style="max-width: 100%; height: auto; border: 1px solid #ddd; padding: 4px"
        />
      </div>
    </div>
  </div>
</div>
